<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pregunta Importante 💖</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* VIDEO DE FONDO */
    #bgVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      opacity: 0.45;
    }

    /* CONTENIDO PRINCIPAL */
    .media {
      width: clamp(300px, 60vw, 320px);
      margin-bottom: 30px;
      z-index: 10;
    }

    .media img {
      width: 100%;
      border-radius: 20px;
    }

    /* BOTONES */
    .buttons {
      display: flex;
      width: 100%;
      max-width: 400px;
      gap: 16px;
      z-index: 10;
      transition: transform 0.35s ease;
    }

    button {
      border: none;
      border-radius: 14px;
      cursor: pointer;
      padding: 16px;
      font-size: clamp(14px, 4vw, 18px);
      transition: all 0.35s ease;
      white-space: nowrap;
      overflow: hidden;
    }

    #yesBtn {
      background-color: #4caf50;
      color: white;
      flex-grow: 1;
    }

    #noBtn {
      background-color: #f44336;
      color: white;
      flex-grow: 1;
    }

    /* BOTONES EN COLUMNA EN MÓVIL */
    @media (max-width: 768px) {
      .buttons {
        flex-direction: column;
        max-width: 90vw;
      }
    }

    /* CONTENIDO FINAL */
    .final-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* TARJETA EMMA (inicia oculta) */
    .emma-card {
      background: rgba(255,255,255,0.85);
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      transform: translateY(-10px) rotate(-2deg);
      opacity: 0;
      transition: all 0.8s ease;
    }

    .emma-card img {
      display: block;
      width: 220px;
      max-width: 80vw;
      border-radius: 12px;
    }

    /* Cuando aparece Emma */
    .emma-card.show {
      opacity: 1;
      transform: translateY(0) rotate(-2deg);
      animation: heartbeat 1.2s ease;
    }

    /* IMAGEN FINAL GRANDE EN MÓVIL */
@media (max-width: 768px) {
  .media.big {
    width: 90vw;
    max-height: 85vh;     /* límite visual */
    overflow-y: auto;    /* 👈 permite bajar */
    padding-bottom: 20px;
  }
}


    @keyframes zoomIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* 💓 EFECTO LATIDO */
    @keyframes heartbeat {
      0%   { transform: scale(1) rotate(-2deg); }
      30%  { transform: scale(1.05) rotate(-2deg); }
      60%  { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1) rotate(-2deg); }
    }
  </style>
</head>
<body>

  <!-- 🎥 VIDEO DE FONDO -->
  <video autoplay muted loop playsinline id="bgVideo">
    <source src="media/video-fondo.mp4" type="video/mp4">
  </video>

  <div class="media" id="media">
    <img src="media/quieres-ser-gif.gif" alt="Gif inicial">
  </div>

  <div class="buttons" id="buttons">
    <button id="yesBtn">Sí, sí quiero 💖</button>
    <button id="noBtn">No, no quiero 🙈</button>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const buttons = document.getElementById("buttons");
    const media = document.getElementById("media");

    let yesGrow = 1;
    let noGrow = 1;

    const frasesNo = [
      "¿Por qué no? 🤨",
      "Sé que sí quieres 😏",
      "Ándale, di que sí 💘",
      "No seas así 😭",
      "Piénsalo bien 🤔",
      "Vamos, solo di que sí 🤍",
      "No te hagas del rogar 😳",
      "En el fondo quieres decir sí 😜"
    ];

    noBtn.addEventListener("click", () => {
      yesGrow += 5;
      noGrow = Math.max(noGrow - 1, 0.3);

      yesBtn.style.flexGrow = yesGrow;
      noBtn.style.flexGrow = noGrow;

      const size = Math.min(18 + yesGrow, 420);
      yesBtn.style.fontSize = size + "px";
      noBtn.style.fontSize = Math.max(12, 18 - yesGrow / 2) + "px";

      if (window.innerWidth <= 768) {
        const lift = Math.min(yesGrow * 2, 120);
        buttons.style.transform = `translateY(-${lift}px)`;
      }

      noBtn.innerHTML = frasesNo[Math.floor(Math.random() * frasesNo.length)];
    });

    yesBtn.addEventListener("click", () => {
      media.innerHTML = `
        <div class="final-content">
          <img src="media/sabia-que-si-gif.gif" alt="Sabía que dirías que sí">
          <div class="emma-card" id="emmaCard">
            <img src="media/emma.jpeg" alt="Emma">
          </div>
        </div>
      `;

      media.classList.add("big");
      buttons.style.display = "none";

      // ⏳ Mostrar a Emma después de 2 segundos
      setTimeout(() => {
        const emma = document.getElementById("emmaCard");
        if (emma) emma.classList.add("show");
      }, 2000);
    });
  </script>

</body>
</html>
